name: hrm.hrm_act_v4_simple@HierarchicalReasoningModel_ACTV4Simple
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 8

# Architecture layers
H_layers: 2  # Number of refinement blocks
L_layers: 4  # SRU layers for sequential processing

hidden_size: 128
num_heads: 8
expansion: 3

# Refinement parameters
refinement_steps: 5  # Number of iterative refinement steps

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: rope

# Use float16 for GPU
forward_dtype: float16
